<!--
  Static form definitions so Netlify's build bot reliably detects our forms.
  Astro-generated pages are sometimes missed by Netlify's parser; this plain
  HTML file (deployed at /__forms.html) guarantees both forms are registered.
  The real, interactive forms live on /contact and / (home) and POST here.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Manovana forms</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="interest">
        <option>1-to-1 Coaching</option>
      </select>
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
    </form>

    <form name="freebie" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="freebie" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="checkbox" name="consent" />
    </form>

    <form name="assessment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="assessment" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input name="q1" />
      <input name="q2" />
      <input name="q3" />
      <input name="q4" />
      <input name="q5" />
      <input name="score" />
      <input name="level" />
      <input type="checkbox" name="consent" />
    </form>
  </body>
</html>
